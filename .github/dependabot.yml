# =========================================================================
# Dependabot — weekly security + minor-version PRs across the three
# subprojects + the workflow files themselves.
#
# Patch + minor land as PRs, ready for one-click merge after CI is green.
# Major bumps still go through manual review (no `versioning-strategy`
# override below — Dependabot's default behaviour for `>=` constraints).
# =========================================================================

version: 2
updates:
  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, sdk]
    commit-message:
      prefix: "chore(sdk-deps)"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "chore(backend-deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(frontend-deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker-backend)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker-frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(actions)"
