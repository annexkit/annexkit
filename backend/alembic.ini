# =========================================================================
# Alembic config
# -------------------------------------------------------------------------
# Most defaults are fine. The parts that matter for us:
#   - script_location: where migration files live
#   - sqlalchemy.url: left blank; we load the URL from app.config at runtime
#     inside alembic/env.py (so the same settings.py drives migrations and
#     the app itself — one source of truth).
# =========================================================================
[alembic]
# Path (relative to this file) where the migration environment lives.
script_location = alembic

# Template used when you run `alembic revision`. %%(rev)s keeps auto-named
# files short and searchable.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the file_template timestamps. UTC so dev laptops around the
# world produce identical filenames.
timezone = UTC

# Intentionally blank: alembic/env.py reads the URL from settings instead.
# Leaving it unset means alembic won't use a DSN from this file at all.
sqlalchemy.url =


# --- Logging -----------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
