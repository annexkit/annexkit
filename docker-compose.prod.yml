# =========================================================================
# AnnexKit — production override (Hetzner VPS, co-hosted with Konformia)
# -------------------------------------------------------------------------
# This file overlays docker-compose.yml on the production VPS at
# /home/annexkit/annexkit/. Use it with:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Three deliberate overrides:
#
#   1. db: read credentials from .env (overrides the hardcoded dev defaults
#      in docker-compose.yml so the first volume init uses real secrets).
#   2. backend / frontend: drop host port mappings — the Konformia Caddy
#      stack reverse-proxies via the shared Docker network.
#   3. networks: join `konformia_default` (created by the Konformia stack)
#      so Caddy can resolve `annexkit-backend:8000` and
#      `annexkit-frontend:3000` for `annexkit.dev` / `www.annexkit.dev`.
#
# The frontend `HOSTNAME: 0.0.0.0` env keeps Next.js standalone listening
# on all interfaces (without it, it binds to the container hostname only
# and fails when Caddy dials over a different Docker network IP — see
# annexkit-deployment-runbook.md §3.5 on Desktop for the original bug).
#
# Caddy itself + the Caddyfile live in the Konformia repo
# (/home/konformia/Konformia/Caddyfile) — managed there, not here.
#
# Deploy from your laptop with `make prod-deploy` (see Makefile).
# =========================================================================

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: !reset []

  backend:
    # Override the dev `--reload` command — production runs a single
    # worker without the file watcher. The reloader's parent-watcher
    # pattern masks startup failures as "Up" containers (the parent
    # stays alive after the child crashes), which we hit in prod when
    # a new dep was in the image but missing from the stale anon volume.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Drop the dev bind-mount (./backend:/app) and the anonymous
    # /app/.venv volume — both cause stale state in prod:
    #   - the bind mount would overlay the image's source with the
    #     host's, undoing the build
    #   - the anonymous /app/.venv persists across `up --build`, so a
    #     newly-added pyproject dep stays missing until something else
    #     opportunistically resyncs (e.g. `uv run alembic` during a
    #     migration step). We keep only `docstore` for PDF persistence.
    volumes: !override
      - docstore:/data/documents
    ports: !reset []
    networks:
      - default
      - shared

  frontend:
    environment:
      HOSTNAME: 0.0.0.0
    ports: !reset []
    networks:
      - default
      - shared

networks:
  default:
  shared:
    name: konformia_default
    external: true
