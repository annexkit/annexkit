[project]
name = "annexkit-demo-chatbot-anthropic"
version = "0.1.0"
description = "End-to-end AnnexKit demo: Anthropic Claude -> collector -> Annex IV PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "annexkit",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
# Pull the SDK from the local sibling path so the demo always runs against
# the version of AnnexKit you have checked out — no PyPI roundtrip needed.
annexkit = { path = "../../sdk", editable = true }

[tool.uv]
# This project ships a script (``chatbot.py``); it is not a library to be
# built or published. ``package = false`` skips the build step on
# ``uv sync`` so we don't need a hatchling/setuptools config for an
# example file.
package = false
