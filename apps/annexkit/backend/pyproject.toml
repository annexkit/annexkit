[project]
name = "annexkit-backend"
version = "0.0.1"
description = "AnnexKit collector — EU AI Act compliance pipeline backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mistralai>=1.7.0",
    "pgvector>=0.3.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Local test runs need the shared engine on sys.path; in the container
# konformia_core sits at /app and is already importable.
pythonpath = ["../../../core"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q"
filterwarnings = [
    # Starlette renamed HTTP_422_UNPROCESSABLE_ENTITY → HTTP_422_UNPROCESSABLE_CONTENT;
    # FastAPI itself still uses the old name as of 0.136 — not our code.
    "ignore::DeprecationWarning:fastapi.routing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
