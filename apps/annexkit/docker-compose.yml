# =========================================================================
# AnnexKit — local dev stack
# -------------------------------------------------------------------------
# `make up` starts the collector backend + Postgres. Stack:
#   - db       Postgres 16 with pgvector, host-exposed on :5438
#   - backend  FastAPI on :8033 (host) -> :8000 (container), live reload
#
# Ports are non-standard (5438 / 8033) so a dev box running a different
# Postgres or FastAPI service on the canonical ports can still bring this
# stack up without collisions.
#
# Trust center frontend (Next.js) is not in compose yet — added in M3.
# =========================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: annexkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: annexkit
      POSTGRES_USER: annexkit
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annexkit -d annexkit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Context is the repo root (../../ from this compose file) so the image
      # can include core/ (the shared engine). Dockerfile lives in the backend.
      context: ../../
      dockerfile: apps/annexkit/backend/Dockerfile
    container_name: annexkit-backend
    # `--reload` watches /app and restarts uvicorn on every file change.
    # `--reload-dir app` keeps the watcher off /app/.venv so installs
    # don't trigger reload loops.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8033:8000"
    env_file: .env
    volumes:
      # Source bind-mount so host edits hot-reload inside the container.
      - ./backend:/app
      # The shared engine — importable + hot-reloadable in dev (the prod image
      # bakes it in via COPY). Required because the bind mount above otherwise
      # shadows the image's /app/konformia_core.
      - ../../core/konformia_core:/app/konformia_core
      # Isolate the container's venv from the host so Mac wheels don't
      # poison the Linux one.
      - /app/.venv
      # Persistent storage for generated Annex IV PDFs — outside the bind
      # mount so they survive rebuilds and never touch git.
      - docstore:/data/documents
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: annexkit-frontend
    ports:
      - "3001:3000"
    environment:
      # Inside the compose network, the backend is reachable at the
      # service name + container port (not the host-mapped 8033).
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend

# Pinned names (see the note in docker-compose.prod.yml) so a project/dir rename
# can't orphan the prod DB into a new empty volume. Equals the existing `annexkit`
# project volumes; the same names are reused in dev and prod.
volumes:
  pgdata:
    name: annexkit_pgdata
  docstore:
    name: annexkit_docstore
